AWSTemplateFormatVersion: '2010-09-09'

Description: Hospital Disaster Recovery Backup Infrastructure (Sandbox/Test - No Permanent Lock)

Resources:

  HospitalBackupVaultSandbox:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: Hospital-Backup-Vault-Sandbox

  BackupRoleSandbox:
    Type: AWS::IAM::Role
    Properties:
      RoleName: HospitalBackupRoleSandbox
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores

  HospitalBackupPlanSandbox:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: Hospital-Daily-Backup-Plan-Sandbox
        BackupPlanRule:
          - RuleName: DailyBackups
            TargetBackupVault: !Ref HospitalBackupVaultSandbox
            ScheduleExpression: cron(0 5 * * ? *)
            StartWindowMinutes: 60
            CompletionWindowMinutes: 180
            Lifecycle:
              DeleteAfterDays: 7

  HospitalBackupSelectionSandbox:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref HospitalBackupPlanSandbox
      BackupSelection:
        SelectionName: TaggedResourcesSelectionSandbox
        IamRoleArn: !GetAtt BackupRoleSandbox.Arn
        ListOfTags:
          - ConditionType: STRINGEQUALS
            ConditionKey: Backup
            ConditionValue: 'true'

Outputs:

  BackupVaultName:
    Description: Name of the Sandbox Backup Vault
    Value: !Ref HospitalBackupVaultSandbox

  BackupPlanId:
    Description: ID of the Sandbox Backup Plan
    Value: !Ref HospitalBackupPlanSandbox
